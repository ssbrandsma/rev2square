# Rev2Square production vhost (WP5B). TLS terminates at the Caddy proxy in
# front of this server; this vhost only serves plain HTTP on the Compose
# network. The HTTP->HTTPS redirect and HSTS live in docker/caddy/Caddyfile.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/public;
    index index.php;

    # Re-resolve the php-fpm upstream through Docker's embedded DNS: plain
    # `fastcgi_pass app:9000` pins the IP nginx saw at startup, so every app
    # recreation (upgrade, rebuild) would 502 until nginx reloads.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 8m;

    # Compiled Vite assets: immutable, cache aggressively.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
