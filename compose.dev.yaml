name: rev2square

# WP0 local development stack. Build context is the repo root so the app
# image can COPY docker/ assets. `compose.prod.yaml` is a WP5 deliverable.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www
      - ./docker/php/conf.d-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.28
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11.8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-rev2square}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 3s
      retries: 12

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # --max-time exits 0 hourly by design; the restart policy brings the
    # worker back, same as production (an exited worker silently strands
    # queued imports otherwise).
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - .:/var/www
      - ./docker/php/conf.d-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      db:
        condition: service_healthy

  # Exactly one scheduler instance; never scale this service.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www
      - ./docker/php/conf.d-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      db:
        condition: service_healthy

  node:
    image: node:22
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

  # Self-hosted WebSocket server for chat + presence. Browsers reach it
  # through nginx (/app/* proxy), so no host port is published.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - .:/var/www

  # Restricted analysis coordinator: serves ONLY the 'analysis' queue
  # on the 'analysis-database' connection. Its environment is an
  # explicit allowlist (DB + framework basics) — no APP_KEY, no mail,
  # no AI credentials — and the bind-mounted repo .env is masked by a
  # minimal non-secret env file so secrets cannot leak in via file.
  analysis-coordinator:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "analysis-database", "--queue=analysis", "--sleep=3", "--tries=1", "--max-time=3600"]
    volumes:
      - .:/var/www
      - ./docker/php/conf.d-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/analysis/coordinator.env:/var/www/.env:ro
      - analysis-spool:/spool
      - analysis-results:/results
    environment:
      APP_NAME: ${APP_NAME:-Rev2Square}
      APP_ENV: ${APP_ENV:-local}
      LOG_CHANNEL: ${LOG_CHANNEL:-single}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-rev2square}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      BINARY_SPOOL_DIR: /spool
      BINARY_RESULTS_DIR: /results
    depends_on:
      db:
        condition: service_healthy

  # Isolated tool runners: no network, read-only root, non-root user,
  # read-only spool mount. One concurrent heavy job server-wide is
  # enforced by the spool lock (see docker/analysis/runner.py).
  # NOTE: the tool images ship ARM64 binaries; on x86 dev machines
  # these services build but cannot run natively (documented).
  objdump-runner:
    build:
      context: docker/analysis
      dockerfile: Dockerfile.binutils
    image: rev2square/binutils:2.40-2
    # Locally built only — never pull this tag from a registry.
    pull_policy: never
    restart: unless-stopped
    user: "www-data"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
      - /work
    volumes:
      - analysis-spool:/spool:ro
      - analysis-results:/results
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ghidra-runner:
    build:
      context: docker/analysis
      dockerfile: Dockerfile.ghidra
    image: rev2square/ghidra:12.2
    pull_policy: never
    restart: unless-stopped
    user: "www-data"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
      - /work
      - /home/www-data
    volumes:
      - analysis-spool:/spool:ro
      - analysis-results:/results
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  jadx-runner:
    build:
      context: docker/analysis
      dockerfile: Dockerfile.jadx
    image: rev2square/jadx:1.5.6
    pull_policy: never
    restart: unless-stopped
    user: "www-data"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
      - /work
    volumes:
      - analysis-spool:/spool:ro
      - analysis-results:/results
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ilspy-runner:
    build:
      context: docker/analysis
      dockerfile: Dockerfile.ilspy
    image: rev2square/ilspy:11.2.0.10050
    pull_policy: never
    restart: unless-stopped
    user: "www-data"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
      - /work
    volumes:
      - analysis-spool:/spool:ro
      - analysis-results:/results
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  extract-runner:
    build:
      context: docker/analysis
      dockerfile: Dockerfile.extract
    image: rev2square/extract:1.0
    pull_policy: never
    restart: unless-stopped
    user: "www-data"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /work:size=1g
    volumes:
      - analysis-spool:/spool:ro
      - analysis-results:/results
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  db-data:
  analysis-spool:
  analysis-results:
