# Rev2Square — Apache reverse-proxy snippet for a Virtualmin virtual server.
#
# WHERE TO PASTE (preferred, survives Virtualmin rewrites):
#   Virtualmin -> select the Rev2Square virtual server -> Services ->
#   Configure Website -> Edit Directives, inside the :443 (SSL) VirtualHost.
# Do NOT paste this into the :80 VirtualHost: port 80 should keep
# Virtualmin's default behavior (ACME challenges + redirect to HTTPS).
#
# REQUIRED MODULES (check with: httpd -M 2>/dev/null | grep -Ei 'proxy|headers'):
#   proxy, proxy_http, headers. (ssl is already loaded for the :443 vhost.)
#   Enable on AlmaLinux if missing: edit /etc/httpd/conf.modules.d/ or
#   `dnf install mod_proxy_html` is NOT needed; proxy/proxy_http/headers
#   ship with httpd — uncomment the LoadModule lines and `systemctl reload httpd`.
#
# WHAT THIS DOES:
# - Forwards all traffic to the Rev2Square Docker stack on loopback :8081
#   (mirror APP_LOOPBACK_PORT from .env.virtualmin if changed).
# - Strips any client-supplied X-Forwarded-* headers first, then sets clean
#   ones, so tenants behind the same Apache cannot spoof client IPs, hosts,
#   or the HTTPS marker.
# - Preserves the original Host for Laravel URL generation.
# - No WebSocket rules: Rev2Square uses plain HTTP (Livewire AJAX, no
#   Reverb/Pusher/Echo; BROADCAST_CONNECTION=log).
#
# VERIFY AFTER PASTING (as root):
#   apachectl configtest && systemctl reload httpd
#   curl -fsS https://<domain>/up
#   curl -s -o /dev/null -D - https://<domain>/ | grep -i '^set-cookie'   # must contain "secure"

ProxyPreserveHost On

# Sanitize first: drop whatever the client claims, so mod_proxy below
# records only values Apache itself observed.
RequestHeader unset X-Forwarded-For
RequestHeader unset X-Forwarded-Host
RequestHeader unset X-Forwarded-Proto
RequestHeader unset X-Forwarded-Port
RequestHeader unset Forwarded

# mod_proxy re-adds X-Forwarded-For (real client IP) and X-Forwarded-Host
# itself; proto/port are never set by mod_proxy, so declare them here.
# This vhost only serves TLS, therefore proto is unconditionally https.
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

# Idle/AI-adjacent web requests are short (heavy AI work runs in the queue
# worker); 120s still tolerates slow clients without hanging workers.
ProxyTimeout 120
ProxyPass / http://127.0.0.1:8081/
ProxyPassReverse / http://127.0.0.1:8081/
