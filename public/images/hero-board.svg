<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="heroBoardTitle">
  <title id="heroBoardTitle">Traced circuit paths converging on a chip</title>
  <!-- Depth lines -->
  <path d="M40 508 H600" stroke="#27272a" stroke-width="3" fill="none"/>
  <path d="M614 130 V400" stroke="#27272a" stroke-width="3" fill="none"/>
  <!-- Chip -->
  <rect x="250" y="180" width="140" height="140" rx="8" fill="none" stroke="#3f3f46" stroke-width="3"/>
  <path d="M250 200 H234 M250 228 H234 M250 256 H234 M250 284 H234 M390 200 H406 M390 228 H406 M390 256 H406 M390 284 H406 M270 180 V164 M298 180 V164 M326 180 V164 M354 180 V164 M270 320 V336 M298 320 V336 M326 320 V336 M354 320 V336" stroke="#3f3f46" stroke-width="3" fill="none"/>
  <circle cx="264" cy="194" r="4" fill="#fbbf24"/>
  <!-- Traces -->
  <g stroke="#10b981" stroke-width="3" fill="none" opacity="0.55">
    <path d="M234 200 H150 L110 160 H60"/>
