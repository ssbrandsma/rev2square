; Rev2Square upload-path limits (research artifacts up to 64 MiB per file).
; Loaded by every PHP service (FPM + CLI workers). Must stay in sync with
; client_max_body_size (80m) in docker/nginx/default.conf and
; docker/nginx/default.prod.conf, and with the batch guidance in
; resources/views/projects/agent/index.blade.php.
;
; Per-file PHP ceiling sits 1 MiB above the 64 MiB application cap on
; purpose: boundary files then reach Laravel, which reports the exact
; application limit, instead of failing inside PHP with a generic error.
upload_max_filesize = 65M
post_max_size = 80M

; Slow connections uploading tens of megabytes need longer input time.
max_input_time = 300

; Headroom for one 64 MiB in-memory detection pass plus bounded
; extraction structures. Typical usage is far below this ceiling.
memory_limit = 256M
