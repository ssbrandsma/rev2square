name: rev2square-virtualmin

# Rev2Square production stack for a Virtualmin-managed VPS (WP5B adaptation).
# See docs/DEPLOYMENT_VIRTUALMIN_ARM64.md.
#
# Usage (from the repo root on the server, as root):
#   docker compose -f compose.virtualmin.yaml --env-file /etc/rev2square/.env.virtualmin up -d --build
#
# Differences from compose.prod.yaml:
# - NO Caddy proxy: Virtualmin-managed Apache terminates TLS on ports
#   80/443 and reverse-proxies to this stack on 127.0.0.1:8081 (see
#   docker/virtualmin/apache-vhost-snippet.conf).
# - nginx publishes ONLY a loopback port (default 127.0.0.1:8081,
#   configurable via APP_LOOPBACK_PORT). Nothing else publishes ports.
# - All services pin an explicit target platform, defaulting to
#   linux/arm64 for the Hetzner ARM64 VPS (override with DOCKER_PLATFORM
#   for local behavior validation on amd64).
# - Same hardened images, users, capabilities, healthchecks, and restart
#   policies as compose.prod.yaml; the Dockerfiles are shared unchanged.
# - app-storage named volume shares durable private user data
#   (storage/app) between app, queue, and analysis-coordinator.
# - Secrets come from /etc/rev2square/.env.virtualmin (chmod 600, never
#   committed). Pass the same path via --env-file for Compose variable
#   interpolation; the services' env_file entries read it into containers.

services:
  app:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: rev2square/app:${APP_VERSION:-latest}
    # Locally built (see the build && up upgrade flow); a missing image
    # must fail fast locally, never attempt a Docker Hub pull.
    pull_policy: never
    # Runtime env comes from the server file (absolute path): this is the
    # SERVICE env_file (container runtime), distinct from the --env-file
    # CLI flag that feeds Compose-file interpolation. Both point at the
    # same /etc file on the server.
    env_file:
      - path: /etc/rev2square/.env.virtualmin
        required: true
    volumes:
      # Shared private user data (research artifacts, presentation
      # media, avatars, attachments, imports): durable across container
      # recreation and visible to every authorized reader/writer (app,
      # queue, analysis-coordinator). Without this mount each container
      # keeps its own storage/app and workers cannot see web uploads.
      # The image pre-chowns /var/www/storage to www-data, so the
      # named-volume init copy preserves uid 33 on both sides; every
      # mounted service runs as www-data, so no chmod is needed and
      # modes stay private. Framework/logs dirs stay per-container.
      - app-storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    user: "www-data"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Boots the framework: proves code + cached config load.
      test: ["CMD-SHELL", "php artisan about >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    image: rev2square/nginx:${APP_VERSION:-latest}
    # Locally built (see the build && up upgrade flow); a missing image
    # must fail fast locally, never attempt a Docker Hub pull.
    pull_policy: never
    # Loopback only: Apache on the same host is the sole client. Never
    # replace 127.0.0.1 with 0.0.0.0 here — container services must not be
    # publicly exposed on a Virtualmin host.
    ports:
      - "127.0.0.1:${APP_LOOPBACK_PORT:-8081}:80"
    depends_on:
      - app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Full HTTP path through php-fpm (nginx runs no env of its own).
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    image: mariadb:11.8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in /etc/rev2square/.env.virtualmin (and pass --env-file /etc/rev2square/.env.virtualmin)}
      MYSQL_DATABASE: ${DB_DATABASE:-rev2square}
      MYSQL_USER: ${DB_USERNAME:-rev2square}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in /etc/rev2square/.env.virtualmin (and pass --env-file /etc/rev2square/.env.virtualmin)}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No ports: isolated from Virtualmin's host MariaDB and from the network.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 12

  queue:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    # Shares the app image (built once via the app service): no build block
    # here, so parallel builds never race exporting the same tag.
    image: rev2square/app:${APP_VERSION:-latest}
    pull_policy: never
    # --max-time exits 0 hourly by design; the restart policy brings the
    # worker back with fresh code, which also bounds memory growth.
    # Single worker: conservative for the 4 GB shared VPS.
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - path: /etc/rev2square/.env.virtualmin
        required: true
    volumes:
      # Shared private user data (see the app service comment): the
      # worker reads web uploads and writes extraction snapshots and
      # media derivatives here.
      - app-storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    user: "www-data"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "for f in /proc/[0-9]*/cmdline; do grep -qa 'queue:work' \"$$f\" 2>/dev/null && exit 0; done; exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Exactly one scheduler instance; never scale this service.
  scheduler:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    # Shares the app image (built once via the app service); see queue.
    image: rev2square/app:${APP_VERSION:-latest}
    pull_policy: never
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - path: /etc/rev2square/.env.virtualmin
        required: true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    user: "www-data"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "for f in /proc/[0-9]*/cmdline; do grep -qa 'schedule:work' \"$$f\" 2>/dev/null && exit 0; done; exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Restricted analysis coordinator: serves ONLY the 'analysis' queue
  # on the 'analysis-database' connection. Shares the app image (no
  # secrets baked in) but takes NO env_file: its environment is an
  # explicit allowlist interpolated from --env-file
  # /etc/rev2square/.env.virtualmin.
  # Absent on purpose: APP_KEY, DB_ROOT_PASSWORD, session/mail/AI keys.
  # Exactly one instance; never scale this service.
  # --timeout=800 is the backstop for jobs without their own $timeout;
  # every analysis-queue job sets its own (analysis <= wall + grace +
  # max probe + margin, refresh = probe-budget sum + margin, prune 120).
  analysis-coordinator:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    image: rev2square/app:${APP_VERSION:-latest}
    pull_policy: never
    command: ["php", "artisan", "queue:work", "analysis-database", "--queue=analysis", "--sleep=3", "--tries=1", "--timeout=800", "--max-time=3600"]
    environment:
      APP_NAME: ${APP_NAME:-Rev2Square}
      APP_ENV: ${APP_ENV:-production}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in /etc/rev2square/.env.virtualmin (and pass --env-file /etc/rev2square/.env.virtualmin)}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in /etc/rev2square/.env.virtualmin (and pass --env-file /etc/rev2square/.env.virtualmin)}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in /etc/rev2square/.env.virtualmin (and pass --env-file /etc/rev2square/.env.virtualmin)}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      DEPLOY_VARIANT: ${DEPLOY_VARIANT:-}
      BINARY_SPOOL_DIR: /spool
      BINARY_RESULTS_DIR: /results
    volumes:
      - analysis-spool:/spool
      - analysis-results:/results
      # Shared private user data (see the app service comment): the
      # coordinator reads artifact originals and writes analysis
      # evidence plus promoted child artifacts here.
      - app-storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    user: "www-data"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "for f in /proc/[0-9]*/cmdline; do grep -qa 'queue:work' \"$$f\" 2>/dev/null && exit 0; done; exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Isolated tool runners (see docker/analysis/). Common boundary:
  # linux/arm64, no network, read-only root, non-root user, dropped
  # capabilities, read-only spool mount, tmpfs workdirs, bounded RAM
  # and PIDs. One concurrent heavy job server-wide via the spool
  # lock. Images are built locally from pinned Dockerfiles (never
  # pulled); record `docker images --digests` after building.
  objdump-runner:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: docker/analysis
      dockerfile: Dockerfile.binutils
    image: rev2square/binutils:2.40-2
    pull_policy: never
    volumes:
      - analysis-spool:/spool:ro
      - analysis-results:/results
    tmpfs:
      - /tmp
      - /work
    restart: unless-stopped
    user: "www-data"
    network_mode: none
    read_only: true
    mem_limit: 1g
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ghidra-runner:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: docker/analysis
      dockerfile: Dockerfile.ghidra
    image: rev2square/ghidra:12.2
    pull_policy: never
    volumes:
      - analysis-spool:/spool:ro
      - analysis-results:/results
    tmpfs:
      - /tmp
      - /work
      # Pinned ownership: a plain tmpfs mount is root-owned and would
      # hide the image's www-data-owned home (Java user.home must be
      # writable by the runtime user).
      - /home/www-data:uid=33,gid=33,mode=755
    restart: unless-stopped
    user: "www-data"
    network_mode: none
    read_only: true
    mem_limit: 2500m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jadx-runner:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: docker/analysis
      dockerfile: Dockerfile.jadx
    image: rev2square/jadx:1.5.6
    pull_policy: never
    volumes:
      - analysis-spool:/spool:ro
      - analysis-results:/results
    tmpfs:
      - /tmp
      - /work
    restart: unless-stopped
    user: "www-data"
    network_mode: none
    read_only: true
    mem_limit: 1500m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ilspy-runner:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: docker/analysis
      dockerfile: Dockerfile.ilspy
    image: rev2square/ilspy:11.2.0.10050
    pull_policy: never
    volumes:
      - analysis-spool:/spool:ro
      - analysis-results:/results
    tmpfs:
      - /tmp
      - /work
    restart: unless-stopped
    user: "www-data"
    network_mode: none
    read_only: true
    mem_limit: 1500m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  extract-runner:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: docker/analysis
      dockerfile: Dockerfile.extract
    image: rev2square/extract:1.0
    pull_policy: never
    volumes:
      - analysis-spool:/spool:ro
      - analysis-results:/results
    tmpfs:
      - /tmp:size=512m
      - /work:size=1g
    restart: unless-stopped
    user: "www-data"
    network_mode: none
    read_only: true
    mem_limit: 1g
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  analysis-spool:
  analysis-results:
  # Durable private user data shared by app/queue/analysis-coordinator
  # (see the app service comment). Never `down -v`: that destroys
  # uploads. Migrate existing container-layer files BEFORE the first
  # recreation with this mount (docs/DEPLOYMENT_VIRTUALMIN_ARM64.md).
  app-storage:
