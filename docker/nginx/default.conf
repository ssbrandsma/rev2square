server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # Research-artifact batches: 64 MiB per file, ~80 MiB total per
    # request. Must stay in sync with post_max_size in
    # docker/php/conf.d-uploads.ini.
    client_max_body_size 80m;
    error_page 413 /413.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pusher-protocol WebSocket traffic for the Reverb server (chat +
    # presence). Same host/port as the app, so browsers need no extra config.
    location ~ ^/app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
