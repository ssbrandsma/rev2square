name: rev2square

# WP0 local development stack. Build context is the repo root so the app
# image can COPY docker/ assets. `compose.prod.yaml` is a WP5 deliverable.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.28
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11.8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-rev2square}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 3s
      retries: 12

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # --max-time exits 0 hourly by design; the restart policy brings the
    # worker back, same as production (an exited worker silently strands
    # queued imports otherwise).
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy

  # Exactly one scheduler instance; never scale this service.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy

  node:
    image: node:22
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

  # Self-hosted WebSocket server for chat + presence. Browsers reach it
  # through nginx (/app/* proxy), so no host port is published.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - .:/var/www

volumes:
  db-data:
