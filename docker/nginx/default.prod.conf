# Rev2Square production vhost (WP5B). TLS terminates at the Caddy proxy in
# front of this server; this vhost only serves plain HTTP on the Compose
# network. The HTTP->HTTPS redirect and HSTS live in docker/caddy/Caddyfile.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/public;
    index index.php;

    # Re-resolve the php-fpm upstream through Docker's embedded DNS: plain
    # `fastcgi_pass app:9000` pins the IP nginx saw at startup, so every app
    # recreation (upgrade, rebuild) would 502 until nginx reloads.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Research-artifact batches: 64 MiB per file, ~80 MiB total per
    # request. Must stay in sync with post_max_size in
    # docker/php/conf.d-uploads.ini.
    client_max_body_size 80m;
    error_page 413 /413.html;

    # Compiled Vite assets: immutable, cache aggressively.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pusher-protocol WebSocket traffic for the Reverb server (chat +
    # presence). Same host/port as the app: browsers open wss://<host>/app/*
    # against the TLS terminator (Caddy or Virtualmin Apache), which
    # forwards plain ws here; only this path is proxied to Reverb, so a
    # missing reverb service (compose.prod.yaml) 502s just /app/* URLs
    # while ordinary traffic is unaffected. Upstream via variable (see the
    # resolver note above) so reverb recreations never 502 until reload.
    # 24h proxy timeouts: sockets are long-lived; Reverb pings every 60s.
    location ~ ^/app/ {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
