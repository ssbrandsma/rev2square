    <path d="M326 164 V100 H440"/>
    <path d="M270 336 V400 L310 440 H420"/>
    <path d="M298 336 V380 H200 L160 420 V470"/>
    <path d="M326 336 V420 H380"/>
    <path d="M354 336 V360 H450 L480 390 V410"/>
    <path d="M490 452 V476 L504 490"/>
    <path d="M530 452 V490"/>
  </g>
  <!-- End pads -->
  <g fill="#18181b" stroke="#10b981" stroke-width="3">
    <circle cx="60" cy="160" r="7"/>
    <circle cx="120" cy="228" r="7"/>
    <circle cx="70" cy="296" r="7"/>
    <circle cx="80" cy="324" r="7"/>
    <circle cx="590" cy="160" r="7"/>
    <circle cx="520" cy="228" r="7"/>
    <circle cx="570" cy="296" r="7"/>
    <circle cx="580" cy="324" r="7"/>
    <circle cx="380" cy="80" r="7"/>
    <circle cx="440" cy="100" r="7"/>
    <circle cx="420" cy="440" r="7"/>
    <circle cx="160" cy="470" r="7"/>
    <circle cx="380" cy="420" r="7"/>
    <circle cx="504" cy="490" r="7"/>
    <circle cx="530" cy="490" r="7"/>
  </g>
  <!-- Vias -->
  <g fill="#18181b" stroke="#10b981" stroke-width="2.5">
    <circle cx="190" cy="200" r="4"/>
    <circle cx="450" cy="200" r="4"/>
    <circle cx="240" cy="380" r="4"/>
    <circle cx="326" cy="132" r="4"/>
    <circle cx="480" cy="410" r="4"/>
  </g>
  <!-- Debug header -->
  <g>
    <rect x="470" y="420" width="12" height="12" rx="2" fill="#fbbf24"/>
    <rect x="490" y="420" width="12" height="12" rx="2" fill="#3f3f46"/>
    <rect x="510" y="420" width="12" height="12" rx="2" fill="#3f3f46"/>
    <rect x="530" y="420" width="12" height="12" rx="2" fill="#3f3f46"/>
    <rect x="550" y="420" width="12" height="12" rx="2" fill="#3f3f46"/>
    <rect x="470" y="436" width="12" height="12" rx="2" fill="#3f3f46"/>
    <rect x="490" y="436" width="12" height="12" rx="2" fill="#3f3f46"/>
    <rect x="510" y="436" width="12" height="12" rx="2" fill="#3f3f46"/>
    <rect x="530" y="436" width="12" height="12" rx="2" fill="#3f3f46"/>
    <rect x="550" y="436" width="12" height="12" rx="2" fill="#3f3f46"/>
