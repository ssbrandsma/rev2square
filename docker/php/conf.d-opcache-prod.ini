; Rev2Square production OPcache settings (WP5B).
; Timestamps are not revalidated: a deploy always rebuilds the image and
; recreates containers, so fresh code is picked up without stat overhead.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
