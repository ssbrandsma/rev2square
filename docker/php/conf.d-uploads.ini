; Rev2Square upload-path limits (research artifacts up to 64 MiB per file).
; Installed at /usr/local/etc/php/conf.d/uploads.ini, which the official
; php:8.4-fpm image scans for EVERY SAPI (php-fpm HTTP workers AND php CLI
; queue/scheduler workers). Must stay in sync with client_max_body_size
; (80m) in docker/nginx/default.conf and docker/nginx/default.prod.conf,
; and with the batch guidance in resources/views/projects/agent/index.blade.php.
;
; Precedence: this file overrides php.ini-production defaults (2M/8M).
; It loads alphabetically after opcache-prod.ini (no overlapping keys),
; and the repo ships no FPM pool php_admin_value/php_value overrides, so
; php-fpm inherits these values (stock www.conf sets none).
;
; Per-file PHP ceiling matches the 64 MiB application cap exactly.
; Oversized files fail with UPLOAD_ERR_INI_SIZE, which ArtifactController
; translates to the clear per-file message naming the 64.0 MiB limit.
upload_max_filesize = 64M
post_max_size = 80M

; Slow connections uploading tens of megabytes need longer input time.
max_input_time = 300

; Headroom for one 64 MiB in-memory detection pass plus bounded
; extraction structures. Typical usage is far below this ceiling.
; Not raised merely to match upload size; public presentation-media caps
; (12M images / 25M files) stay enforced separately by MediaUploadService.
memory_limit = 256M
